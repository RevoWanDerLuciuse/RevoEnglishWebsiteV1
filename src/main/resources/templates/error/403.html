<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: common-head}"/>
    <th:block th:replace="~{fragments/layout :: seo('Нет доступа · Revo English', 'Эта страница недоступна.', '/403', false)}"/>
</head>
<body>

<th:block th:replace="~{fragments/layout :: site-header('none')}"/>

<main id="main" class="error-page">
    <div class="container error-page__inner">
        <p class="error-page__code" aria-hidden="true">403</p>
        <h1 class="error-page__title">Нет <em>доступа</em></h1>
        <p class="error-page__lead">
            У&nbsp;вашего аккаунта нет доступа к&nbsp;этой странице.
        </p>
        <div class="error-page__actions">
            <a class="btn btn--primary" th:href="@{/login}">В&nbsp;личный кабинет</a>
            <a class="btn btn--ghost" th:href="@{/}">На главную</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: site-footer}"></footer>

</body>
</html>
