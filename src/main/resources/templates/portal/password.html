<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: common-head}"/>
    <th:block th:replace="~{fragments/layout :: seo('Смена пароля · Revo English', 'Смена пароля в личном кабинете Revo English.', '/account/password', false)}"/>
    <link rel="stylesheet" th:href="@{/css/portal.css}">
</head>
<body>

<th:block th:replace="~{fragments/layout :: portal-header('password')}"/>

<main id="main" class="portal portal--centered">
    <div class="container">
        <section class="portal-card portal-card--narrow" aria-labelledby="password-title">
            <p class="eyebrow">Личный кабинет</p>
            <h1 class="portal-title" id="password-title">Смена <em>пароля</em></h1>

            <p th:if="${me.passwordChangeRequired}" class="portal-alert" role="status">
                Вы вошли с&nbsp;временным паролем. Придумайте свой&nbsp;— после этого откроется кабинет.
            </p>
            <p th:if="${errorMessage != null and errorField == null}" class="portal-alert portal-alert--error" role="alert" th:text="${errorMessage}">Ошибка</p>

            <form class="portal-form" th:action="@{/account/password}" method="post" novalidate>
                <!--/* Hidden username helps password managers attach the new password to the right account */-->
                <input type="text" name="username" th:value="${me.login}" autocomplete="username" hidden>

                <div class="field" th:classappend="${errorField == 'currentPassword'} ? 'field--error'">
                    <label class="field__label" for="currentPassword">Текущий пароль</label>
                    <input class="field__input" id="currentPassword" name="currentPassword" type="password" required
                           autocomplete="current-password"
                           th:attr="aria-invalid=${errorField == 'currentPassword'} ? 'true' : null,
                                    aria-describedby=${errorField == 'currentPassword'} ? 'currentPassword-error' : null">
                    <p th:if="${errorField == 'currentPassword'}" class="field__error" id="currentPassword-error" th:text="${errorMessage}"></p>
                </div>
                <div class="field" th:classappend="${errorField == 'newPassword'} ? 'field--error'">
                    <label class="field__label" for="newPassword">Новый пароль</label>
                    <input class="field__input" id="newPassword" name="newPassword" type="password" required minlength="10"
                           autocomplete="new-password"
                           th:attr="aria-invalid=${errorField == 'newPassword'} ? 'true' : null,
                                    aria-describedby=${errorField == 'newPassword'} ? 'newPassword-error newPassword-hint' : 'newPassword-hint'">
                    <p class="field__hint" id="newPassword-hint">Не меньше 10 символов. Не используйте пароль от других сайтов.</p>
                    <p th:if="${errorField == 'newPassword'}" class="field__error" id="newPassword-error" th:text="${errorMessage}"></p>
                </div>
                <div class="field" th:classappend="${errorField == 'confirmPassword'} ? 'field--error'">
                    <label class="field__label" for="confirmPassword">Новый пароль ещё раз</label>
                    <input class="field__input" id="confirmPassword" name="confirmPassword" type="password" required
                           autocomplete="new-password"
                           th:attr="aria-invalid=${errorField == 'confirmPassword'} ? 'true' : null,
                                    aria-describedby=${errorField == 'confirmPassword'} ? 'confirmPassword-error' : null">
                    <p th:if="${errorField == 'confirmPassword'}" class="field__error" id="confirmPassword-error" th:text="${errorMessage}"></p>
                </div>
                <button class="btn btn--primary btn--block" type="submit">Сохранить пароль</button>
            </form>

            <p th:unless="${me.passwordChangeRequired}" class="portal-note">
                <a class="text-link" th:href="@{${home}}">Вернуться в&nbsp;кабинет</a>
            </p>
        </section>
    </div>
</main>

<footer th:replace="~{fragments/layout :: site-footer}"></footer>

</body>
</html>
